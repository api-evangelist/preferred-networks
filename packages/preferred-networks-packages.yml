name: Preferred Networks packages
description: >-
  Preferred Networks publishes no first-party client SDK for the PLaMo API. Its own quickstart
  instructs developers to use the third-party openai and langchain-openai libraries with the base URL
  repointed, which is a deliberate consequence of the API being OpenAI-compatible — so the absence of
  a PLaMo SDK is a design choice, not neglect, and no SDKs pointer is emitted for this provider. The
  packages below are the first-party libraries and tools PFN does publish; only plamo-translate is a
  PLaMo product package. Versions and dates are read from the PyPI JSON metadata endpoint.
sdk_for_plamo_api:
  first_party: none
  documented_clients:
  - {name: openai, registry: pypi, first_party: false, note: Third-party OpenAI client, documented by PFN with base_url override}
  - {name: langchain-openai, registry: pypi, first_party: false, note: Third-party LangChain integration, documented by PFN with base_url override}
  source: https://docs.plamo.preferredai.jp/en/getting-started
