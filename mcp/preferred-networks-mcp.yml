  - {url: 'https://api.platform.preferredai.jp/.well-known/oauth-protected-resource', status: 404}
  - {url: 'https://api.platform.preferredai.jp/.well-known/ai-plugin.json', status: 404}
  note: >-
    No hosted MCP server for the PLaMo API was found in the documentation, on the product site, in
    the pfnet or pfnet-research GitHub organisations, or at any well-known path. No endpoint URL was
