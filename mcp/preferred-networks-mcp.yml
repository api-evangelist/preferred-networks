crosswalk:
  emitted: false
  reason: >-
    A tool crosswalk requires an OpenAPI to bind tools to operationIds. Preferred Networks publishes
    no OpenAPI (see the contract-discovery probes recorded in conventions/ and conformance/), and the one MCP server it
    ships wraps a local translation model rather than the REST API, so there is nothing to bind.
