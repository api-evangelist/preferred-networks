name: Preferred Networks PLaMo API lifecycle
description: >-
  Versioning, deprecation and end-of-life posture for the PLaMo API. PFN does not publish a named
  deprecation policy document, but it does publish dated, model-by-model and endpoint-by-endpoint
  retirement notices in its API reference and in its product news feed, including migration
  instructions — which is a real, verifiable deprecation practice rather than a stated policy.
versioning:
  api_path: /v1
  scheme: >-
    A single stable /v1 path segment on the API host, with substantive change carried in model IDs
    rather than in the URL. Each model ID states its own context length, maximum output tokens and
    reasoning capability.
  models:
  - id: plamo-3.0-prime
    context_length_tokens: 262144
    max_output_tokens: 20000
    reasoning: true
    status: current
  - id: plamo-3.0-prime-beta
    context_length_tokens: 65536
    max_output_tokens: 20000
    reasoning: true
    status: deprecated
    end_of_life: '2026-07-31'
  - id: plamo-2.2-prime
    context_length_tokens: 32768
    max_output_tokens: 4096
    reasoning: false
    status: deprecated
    end_of_life: '2026-09-30'
deprecation_policy:
  published: true
  form: Dated retirement notices in the API reference and the PLaMo news feed
  url: https://docs.plamo.preferredai.jp/en/api
  sunset_header: not documented
  deprecation_header: not documented
  rfc8594: false
  notice_period_documented: false
  note: >-
    PFN states retirement dates in advance and describes the migration path, but publishes neither a
    named deprecation policy with a guaranteed notice period nor RFC 8594 Sunset/Deprecation response
    headers, so a running client receives no machine-readable warning.
