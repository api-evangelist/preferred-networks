apis:
- name: PLaMo API
  description: >-
    The PLaMo API is Preferred Networks' cloud service for its domestically developed PLaMo large
    language models. Its interface is compatible with the OpenAI API, so existing OpenAI/LangChain
    client code works by pointing the base URL at https://api.platform.preferredai.jp/v1 and
    supplying a PLaMo API key as a bearer token. The published surface is three endpoints — Chat
    Completions (streaming SSE, function calling, JSON-Schema structured outputs and reasoning
    controls), Tokenize, and Models (index + retrieve) — served against the plamo-3.0-prime family.
  image: https://www.preferred.jp/images/ogp.png
