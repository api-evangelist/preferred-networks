aid: preferred-networks
name: Preferred Networks
description: >-
  Preferred Networks, Inc. (PFN) is a Tokyo-based AI company founded in March 2014 that vertically
  integrates the AI value chain from its own MN-Core AI processors and supercomputing infrastructure
  through to generative-AI foundation models, solutions and products. PFN develops PLaMo, a Japanese
  large language model built fully from scratch, and offers it commercially through the cloud-hosted
  PLaMo API — an OpenAI-compatible chat-completions, tokenize and models service at
  api.platform.preferredai.jp — alongside on-premises, Amazon Bedrock Marketplace, Snowflake and edge
  (PLaMo Lite) deployment options. PFN also maintains widely used open-source machine-learning
  software including Optuna, Chainer, PFRL, pytorch-pfn-extras and the PLaMo Translate CLI, which
  doubles as a locally hosted MCP server.
